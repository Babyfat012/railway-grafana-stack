scrape_configs:
  # Job 1: Prometheus tự monitor chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Job 2: Foodfast Backend Node.js API
  - job_name: 'foodfast-backend'
    scheme: https               # ✨ QUAN TRỌNG: dùng https cho Railway
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cnpmfoodfastdelivery-production.up.railway.app']
        labels:
          service: 'backend'
          app: 'foodfast'
          component: 'api'

  # Job 3: Grocery Backend Node.js API
  - job_name: 'grocery-backend'
    scheme: https               # ✨ Dùng https luôn
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grocery-store-production-45bc.up.railway.app']
        labels:
          service: 'backend'
          app: 'grocery'
          component: 'api'
